[package]
name = "keyed"
version = "0.1.0"
description = "KeyEd: touch typing tutor"
edition = "2021"
publish = false

[lib]
name = "keyed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
