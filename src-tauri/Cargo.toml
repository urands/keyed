[package]
name = "keyed"
version = "0.1.0"
description = "KeyEd: touch typing tutor"
edition = "2021"
publish = false

[lib]
name = "keyed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"

# Full debug info of all dependencies takes several gigabytes in target/.
# Line tables are enough for readable backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
